  SCALE = Math.min(window.innerWidth / VW, window.innerHeight / VH);
  canvas.width  = Math.floor(VW * SCALE * DPR);
  canvas.height = Math.floor(VH * SCALE * DPR);
  canvas.style.width  = (VW * SCALE) + 'px';
  canvas.style.height = (VH * SCALE) + 'px';
  const rt = document.getElementById('rotate');
  if(rt) rt.style.display = (window.innerHeight > window.innerWidth) ? 'flex' : 'none';
}
window.addEventListener('resize', resize);
resize();

/* ---------- 工具 ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rr(ctx,x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---------- 音频 ---------- */
let AC = null, muted = false;
function ensureAudio(){ if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); }
function tone(freq, dur, type, vol, slide, delay){
  if(muted) return; ensureAudio(); if(!AC) return;
  const t0 = AC.currentTime + (delay||0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(freq, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
const sfxJump   = ()=> tone(330,0.16,'sine',0.18,700);
const sfxHeart  = ()=>{ tone(880,0.09,'sine',0.16); tone(1318,0.14,'sine',0.16,null,0.06); };
const sfxStomp  = ()=> tone(500,0.12,'square',0.10,180);
const sfxHurt   = ()=> tone(220,0.18,'sawtooth',0.12,140);
const sfxClear  = ()=>{ [523,659,784,1046].forEach((f,i)=> tone(f,0.22,'sine',0.16,null,i*0.09)); };
const sfxStart  = ()=> tone(659,0.2,'sine',0.16,880);
const sfxPower  = ()=>{ [523,659,784,1046,1318].forEach((f,i)=> tone(f,0.15,'sine',0.15,null,i*0.06)); };

/* ---------- 输入 ---------- */
const input = { left:false, right:false, jump:false, jumpPressed:false };
window.addEventListener('keydown', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') input.left=true;
  if(e.code==='ArrowRight'||e.code==='KeyD') input.right=true;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='KeyJ'){ if(!e.repeat) input.jumpPressed=true; input.jump=true; }
  if(e.code==='KeyM') toggleMute();
});
window.addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') input.left=false;
  if(e.code==='ArrowRight'||e.code==='KeyD') input.right=false;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='KeyJ') input.jump=false;
});
/* 触屏按钮 */
const touchBtn = { left:false, right:false, jump:false };
function bindTouch(id, key){
  const el = document.getElementById(id); if(!el) return;
  const on = e=>{ e.preventDefault(); touchBtn[key]=true; if(key==='jump') input.jumpPressed=true; ensureAudio(); };
  const off = e=>{ e.preventDefault(); touchBtn[key]=false; };
  el.addEventListener('touchstart', on, {passive:false});
  el.addEventListener('touchend', off, {passive:false});
  el.addEventListener('touchcancel', off, {passive:false});
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}

/* ---------- 关卡定义 ---------- */
function buildLevel(themeKey, width, gaps, floats, hearts, enemies, flagX){
  const th = THEMES[themeKey];
  const plats = [];
  let cur = 0;
  for(const [g0,g1] of gaps){
    plats.push({x:cur, y:GROUND_TOP, w:g0-cur, h:VH-GROUND_TOP, kind:'ground'});
    cur = g1;
  }
  plats.push({x:cur, y:GROUND_TOP, w:width-cur, h:VH-GROUND_TOP, kind:'ground'});
  for(const [x,y,w] of floats) plats.push({x, y, w, h:20, kind:'float'});
  return {
    theme: th, width,
    platforms: plats,
    hearts: hearts.map(([x,y])=>({ x, y, baseY:y, ph:Math.random()*6.283, taken:false })),
    enemies: enemies.map(([x,l,r])=>({ x, l, r, vx:60, alive:true, squash:0, ph:Math.random()*6.283 })),
    flagX, done:false
  };
}

/* ---------- 粒子 ---------- */
function spawnHearts(x,y,n,color){
  for(let i=0;i<n;i++){
    particles.push({ x, y, vx:(Math.random()-0.5)*160, vy:-Math.random()*180-40, life:1, color:color||'#ff6fa5', s:6+Math.random()*6 });
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy += 500*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*1.4;
    if(p.life<=0) particles.splice(i,1);
  }
}

/* ---------- 花瓣/星星背景 ---------- */
function initPetals(){
  const rnd = mulberry32(levelIdx*7+13);
  const n = level.theme.deco==='star'?70:40;
  petals = [];
  for(let i=0;i<n;i++){
    petals.push({ x:rnd()*level.width, y:rnd()*VH, s:3+rnd()*6, spd:20+rnd()*40, ph:rnd()*6.283, drift:30+rnd()*50 });
  }
}

/* ---------- 载入关卡 ---------- */
function loadLevel(i){
  levelIdx = i;
  level = LEVELS[i];
  player = { x:80, y:GROUND_TOP-PH, vx:0, vy:0, onGround:true, idlePh:0, runPh:0 };
  camX = 0; particles = []; hurtFlash = 0; lastGroundX = 80;
  loveMeter = LOVE_MAX;
  powerups = []; bigTimer = 0;
  initPetals();
  screen = 'play';
}

/* ---------- 更新 ---------- */
function updatePlayer(dt){
  const p = player;
  let dir = 0;
  if(input.left || touchBtn.left) dir -= 1;
  if(input.right || touchBtn.right) dir += 1;
  p.vx = dir * MOVE_SPEED;
  if(input.jumpPressed){ input.jumpPressed=false; if(p.onGround){ p.vy=JUMP_VEL; p.onGround=false; sfxJump(); } }

  p.vy += GRAVITY*dt; p.vy = Math.min(p.vy, MAX_FALL);

  // 水平
  p.x += p.vx*dt;
  p.x = clamp(p.x, 0, level.width-PW);
  for(const pl of level.platforms){
    if(p.x < pl.x+pl.w && p.x+PW > pl.x && p.y < pl.y+pl.h && p.y+PH > pl.y){
      if(p.vx>0) p.x = pl.x-PW; else if(p.vx<0) p.x = pl.x+pl.w;
    }
  }
  // 垂直
  p.y += p.vy*dt;
  p.onGround = false;
  for(const pl of level.platforms){
    if(p.x < pl.x+pl.w && p.x+PW > pl.x && p.y < pl.y+pl.h && p.y+PH > pl.y){
      if(p.vy>0){ p.y = pl.y-PH; p.vy=0; p.onGround=true; lastGroundX=p.x; }
      else { p.y = pl.y+pl.h; p.vy=0; }
    }
  }
  // 掉落坑
  if(p.y > VH+80){ p.x = lastGroundX; p.y = GROUND_TOP-PH; p.vx=0; p.vy=0; p.onGround=true; loveMeter=Math.max(0,loveMeter-12); sfxHurt(); }
  // 相位
  p.idlePh += dt*3; p.runPh += dt*(Math.abs(p.vx)>10?13:0);

  // 敌人
  for(const e of level.enemies){
    if(!e.alive){ if(e.squash>0) e.squash-=dt; continue; }
    e.x += e.vx*dt;
    if(e.x<e.l || e.x>e.r){ e.vx*=-1; }
    e.ph += dt*4;
    const ew=36, eh=30, ey=GROUND_TOP-eh;
    // 判定（把敌人贴在地面上）
    const ex=e.x, eyy=ey;
    if(p.x < ex+ew && p.x+PW > ex && p.y < eyy+eh && p.y+PH > eyy){
      if(bigTimer>0){  // 变大无敌：直接撞飞小怪
        e.alive=false; e.squash=0.3; score+=1; loveMeter=Math.min(LOVE_MAX,loveMeter+4); sfxStomp(); spawnHearts(ex+ew/2,eyy,8,'#ffd166');
      } else if(p.vy>0 && (p.y+PH) < eyy+eh*0.6){  // 踩到 -> 掉落星星道具
        e.alive=false; e.squash=0.3; p.vy=-420; score+=1; loveMeter=Math.min(LOVE_MAX,loveMeter+6); sfxStomp(); spawnHearts(ex+ew/2,eyy,6,'#ffd166');
        powerups.push({ x: ex+ew/2-14, y: eyy-24, vx: 0, vy: -380, ph: Math.random()*6.283, alive: true });
      } else {  // 侧碰
        p.x += (p.x < ex ? -1 : 1)*40; loveMeter=Math.max(0,loveMeter-16); hurtFlash=0.35; sfxHurt();
      }
    }
  }

  // 爱心收集
  for(const h of level.hearts){
    if(h.taken) continue;
    h.y = h.baseY + Math.sin(h.ph)*5; h.ph += dt*2;
    if(p.x < h.x+16 && p.x+PW > h.x-16 && p.y < h.y+16 && p.y+PH > h.y-16){
      h.taken=true; score+=1; loveMeter=Math.min(LOVE_MAX,loveMeter+15); sfxHeart(); spawnHearts(h.x,h.y,8,'#ff6fa5');
    }
  }

  // 到达终点
  if(!level.done && p.x+PW >= level.flagX){
    level.done=true; sfxClear(); setTimeout(()=>{ nextLevel(); }, 900);
  }
}
let loveMeter = LOVE_MAX;

function updatePowerups(dt){
  const p = player;
  for(const pw of powerups){
    if(!pw.alive) continue;
    pw.vy += GRAVITY*dt; pw.vy = Math.min(pw.vy, MAX_FALL);
    pw.y += pw.vy*dt; pw.ph += dt*4;
    if(pw.y + 26 >= GROUND_TOP){ pw.y = GROUND_TOP-26; pw.vy = -Math.abs(pw.vy)*0.45; if(Math.abs(pw.vy)<70) pw.vy=0; }
    if(p.x < pw.x+28 && p.x+PW > pw.x && p.y < pw.y+28 && p.y+PH > pw.y){
      pw.alive=false; bigTimer=8; score+=2; loveMeter=Math.min(LOVE_MAX,loveMeter+20); sfxPower(); spawnHearts(pw.x+14, pw.y+14, 12, '#ffd166');
    }
  }
}

function nextLevel(){
  screen = 'message'; msgIndex = levelIdx; msgTimer = 0;
}
function update(dt){
  if(screen==='play'){
    updatePlayer(dt);
    updatePowerups(dt);
    if(bigTimer>0){ bigTimer -= dt; if(bigTimer<=0){ bigTimer=0; spawnHearts(player.x+PW/2, player.y+PH/2, 10, '#ffd166'); } }
    // 爱心条消耗（变大无敌时不消耗）
    if(bigTimer<=0) loveMeter = Math.max(0, loveMeter - dt*1.1);
    if(loveMeter<=0){ loveMeter = 40; hintTimer = 2.2; }  // 温柔不惩罚
    camX = clamp(player.x + PW/2 - VW*0.42, 0, level.width-VW);
    if(camX<0) camX=0;
  }
  if(screen==='message'){ msgTimer += dt; }
  updateParticles(dt);
  if(hurtFlash>0) hurtFlash-=dt;
  if(hintTimer>0) hintTimer-=dt;
}

/* ---------- 背景绘制 ---------- */
function drawBackground(){
  const th = level.theme;
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, th.skyTop); g.addColorStop(1, th.skyBot);
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // 远景山丘（视差）
  const off1 = -camX*0.2, off2 = -camX*0.4;
  ctx.fillStyle = th.hill1;
  ctx.beginPath(); ctx.moveTo(0,VH);
  for(let x=0;x<=VW+80;x+=80){ const wx=x+off1; ctx.lineTo(x, VH-80 - Math.sin((wx)*0.008)*40 - Math.sin(wx*0.003)*30); }
  ctx.lineTo(VW,VH); ctx.closePath(); ctx.fill();
  ctx.fillStyle = th.hill2;
  ctx.beginPath(); ctx.moveTo(0,VH);
  for(let x=0;x<=VW+80;x+=80){ const wx=x+off2; ctx.lineTo(x, VH-40 - Math.sin((wx)*0.01)*30 - Math.sin(wx*0.004)*20); }
  ctx.lineTo(VW,VH); ctx.closePath(); ctx.fill();
  // 花瓣/星星
  for(const p of petals){
    const px = ((p.x - camX*0.6) % (VW+40) + (VW+40)) % (VW+40) - 20;
    const py = (p.y + Math.sin(p.ph + performance.now()*0.001)*20 + performance.now()*0.001*p.drift) % (VH+20);
    if(th.deco==='star'){ ctx.fillStyle='rgba(255,255,255,'+ (0.4+0.4*Math.sin(p.ph+performance.now()*0.002)) +')'; ctx.beginPath(); ctx.arc(px,py,p.s*0.5,0,6.283); ctx.fill(); }
    else { drawHeartSmall(px,py,p.s, th.accent, 0.5); }
  }
}

/* ---------- 爱心形状 ---------- */
function heartPath(x,y,s){
  const r = s*0.34;            // 瓣半径
  const cy = y - s*0.28;       // 两瓣圆心高度
  const tipY = y + s*0.62;     // 底部尖
  ctx.beginPath();
  ctx.moveTo(x - r*2, cy);
  ctx.arc(x - r, cy, r, Math.PI, 0, true);
  ctx.arc(x + r, cy, r, Math.PI, 0, true);
  ctx.lineTo(x, tipY);
  ctx.closePath();
}
function drawHeartSmall(x,y,s,color,alpha){
  ctx.save(); ctx.globalAlpha=alpha||1; ctx.fillStyle=color; heartPath(x,y,s); ctx.fill(); ctx.restore();
}
function drawHeartBig(x,y,s){
  const g = ctx.createRadialGradient(x,y-s*0.2,s*0.1, x,y,s);
  g.addColorStop(0,'#ffb3cc'); g.addColorStop(1,'#ff5c8a');
  ctx.save();
  ctx.shadowColor='#ff5c8a'; ctx.shadowBlur=18;
  ctx.fillStyle=g; heartPath(x,y,s); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(x-s*0.22,y-s*0.22,s*0.18,0,6.283); ctx.fill();
  ctx.restore();
}

/* ---------- 平台绘制 ---------- */
function drawPlatforms(){
  for(const pl of level.platforms){
    if(pl.x+pl.w < camX-40 || pl.x > camX+VW+40) continue;
    const x=pl.x-camX, y=pl.y;
    if(pl.kind==='ground'){
      const g=ctx.createLinearGradient(0,y,0,y+pl.h);
      g.addColorStop(0, level.theme.hill2); g.addColorStop(1,'#e9c7d8');
      ctx.fillStyle=g; ctx.fillRect(x,y,pl.w,pl.h);
      ctx.fillStyle=level.theme.accent; ctx.globalAlpha=0.55;
      ctx.fillRect(x,y,pl.w,6);
      ctx.globalAlpha=1;
      // 小草装饰
      ctx.fillStyle='rgba(255,255,255,0.5)';
      for(let i=0;i<pl.w;i+=46){ ctx.fillRect(x+i+10,y+8,3,5); ctx.fillRect(x+i+16,y+6,3,6); }
    } else {
      ctx.fillStyle='#fff'; rr(ctx,x,y+4,pl.w,pl.h,10); ctx.fill();
      ctx.fillStyle=level.theme.hill2; rr(ctx,x,y,pl.w,pl.h,10); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=2; rr(ctx,x+3,y+3,pl.w-6,pl.h-6,8); ctx.stroke();
    }
  }
}

/* ---------- 敌人绘制 ---------- */
function drawEnemies(){
  for(const e of level.enemies){
    if(e.x < camX-60 || e.x > camX+VW+60) continue;
    const x=e.x-camX, y=GROUND_TOP-30;
    const bob=Math.sin(e.ph)*4;
    ctx.save();
    if(!e.alive){ ctx.globalAlpha=Math.max(0,e.squash*3); ctx.translate(x+18, GROUND_TOP-4); ctx.scale(1.4,0.4); ctx.translate(-(x+18),-(GROUND_TOP-4)); }
    // 身体
    const g=ctx.createRadialGradient(x+18,y-6+bob,4, x+18,y+14+bob,24);
    g.addColorStop(0,'#ffe3f0'); g.addColorStop(1,'#f2a6c4');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(x+18, y+10+bob, 18, 16, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x+18, y+16+bob, 15, 7, 0, 0, 6.283); ctx.fill();
    // 眼睛
    ctx.fillStyle='#4a2a3a';
    ctx.beginPath(); ctx.arc(x+11, y+8+bob, 2.6, 0, 6.283); ctx.arc(x+25, y+8+bob, 2.6, 0, 6.283); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x+12, y+7+bob, 1, 0, 6.283); ctx.arc(x+26, y+7+bob, 1, 0, 6.283); ctx.fill();
    // 腮红
    ctx.fillStyle='rgba(255,120,150,0.5)';
    ctx.beginPath(); ctx.arc(x+6, y+13+bob, 3, 0, 6.283); ctx.arc(x+30, y+13+bob, 3, 0, 6.283); ctx.fill();
    ctx.restore();
  }
}

/* ---------- 终点旗 ---------- */
function drawFlag(){
  const x=level.flagX-camX;
  if(x < -40 || x > VW+40) return;
  const y=GROUND_TOP;
  ctx.fillStyle='#8a6d50'; ctx.fillRect(x, y-120, 6, 120);
  ctx.fillStyle='#ffd166'; ctx.beginPath(); ctx.arc(x+3, y-120, 6, 0, 6.283); ctx.fill();
  drawHeartBig(x+14, y-96, 22);
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.font='bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('终点', x+40, y-72);
}

/* ---------- 玩家绘制 ---------- */
function drawPlayer(){
  const p=player;
  let img = IMG.front;
  if(p.vx < -10) img = FLIP_SIDE ? IMG.right : IMG.left;
  else if(p.vx > 10) img = FLIP_SIDE ? IMG.left : IMG.right;
  const h=64;
  const ar = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth/img.naturalHeight : 0.4;
  const w = h*ar;
  const big = bigTimer>0;
  const sc = big ? 1.55 : 1;
  const moving = p.onGround && Math.abs(p.vx)>10;
  const bob = moving ? Math.abs(Math.sin(p.runPh))*2.2 : Math.sin(p.idlePh)*1.4;
  const tilt = !p.onGround ? clamp(p.vy*0.0009, -0.22, 0.28) : 0;
  const cx = p.x + PW/2 - camX;
  const feetY = p.y + PH;
  ctx.save();
  ctx.translate(cx, feetY);
  ctx.scale(sc, sc);
  ctx.rotate(tilt);
  if(big){ ctx.shadowColor='#ffd166'; ctx.shadowBlur=22; }
  if(hurtFlash>0 && Math.floor(hurtFlash*20)%2===0) ctx.globalAlpha=0.5;
  ctx.drawImage(img, -w/2, -h-bob, w, h);
  ctx.restore();
}

/* ---------- 爱心收集物绘制 ---------- */
function drawHearts(){
  for(const h of level.hearts){
    if(h.taken) continue;
    const x=h.x-camX;
    if(x < -30 || x > VW+30) continue;
    drawHeartBig(x, h.y, 12);
  }
}

/* ---------- 星星道具 ---------- */
function drawStarPath(x,y,s){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5;
    const r = i%2===0 ? s : s*0.45;
    const px = x + Math.cos(ang)*r, py = y + Math.sin(ang)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}
function drawPowerups(){
  for(const pw of powerups){
    if(!pw.alive) continue;
    const x = pw.x - camX;
    if(x < -40 || x > VW+40) continue;
    const y = pw.y + Math.sin(pw.ph)*3;
    ctx.save();
    ctx.translate(x+14, y+14);
    ctx.rotate(Math.sin(pw.ph)*0.25);
    ctx.shadowColor='#ffd166'; ctx.shadowBlur=16;
    ctx.fillStyle='#ffd166'; drawStarPath(0,0,14); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.85)'; drawStarPath(0,0,5); ctx.fill();
    ctx.restore();
  }
}

/* ---------- UI ---------- */
function drawUI(){
  // 爱心（体力）条
  const bx=20, by=20, bw=200, bh=16;
  ctx.fillStyle='rgba(255,255,255,0.5)'; rr(ctx,bx-4,by-4,bw+8,bh+8,12); ctx.fill();
  const grd=ctx.createLinearGradient(bx,0,bx+bw,0);
  grd.addColorStop(0,'#ff8fb8'); grd.addColorStop(1,'#ff5c8a');
  ctx.fillStyle=grd; rr(ctx,bx,by,bw*(loveMeter/LOVE_MAX),bh,8); ctx.fill();
  drawHeartBig(bx+10, by+bh/2, 8);
  ctx.fillStyle='#fff'; ctx.font='bold 13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('体力', bx+24, by+bh-4);
  // 得分
  ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.3)'; ctx.shadowBlur=4;
  ctx.font='bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('💗 × '+score, VW-150, 40); ctx.shadowBlur=0;
  // 关卡 & 天数
  ctx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.fillText('第 '+(levelIdx+1)+' 关 · '+level.theme.name, 20, 62);
  ctx.fillText('我们在一起的第 54 天', VW-190, 62);
  if(bigTimer>0){
    ctx.textAlign='center';
    ctx.fillStyle='#ffd166'; ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('⭐ 变大中 ' + Math.ceil(bigTimer) + 's', VW/2, 40);
    ctx.textAlign='left';
  }
  if(hintTimer>0){
    ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.font='bold 16px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('累啦～ 吃颗爱心补补体力 💗', VW/2-120, VH/2);
  }
}

/* ---------- 触屏控件 ---------- */
function drawTouch(){
  ctx.globalAlpha=0.30;
  ctx.fillStyle='#fff';
  rr(ctx,18,VH-116,88,88,22); ctx.fill();       // 左
  rr(ctx,120,VH-116,88,88,22); ctx.fill();      // 右
  rr(ctx,VW-116,VH-136,92,108,24); ctx.fill();  // 跳
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(80,40,60,0.75)';
  ctx.font='bold 38px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('◀',62,VH-72);
  ctx.fillText('▶',164,VH-72);
  ctx.fillText('跳',VW-70,VH-82);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

/* ---------- 屏幕：标题 ---------- */
function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#ffd3e6'); g.addColorStop(1,'#fff6fa');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  // 漂浮爱心
  for(let i=0;i<18;i++){
    const x=((i*137+40) % (VW+40)); const y=((i*89+30) % (VH+30));
    drawHeartSmall(x,y,8+i%4, i%2?'#ff9ec4':'#ffc2d9', 0.5+0.3*Math.sin(performance.now()*0.001+i));
  }
  // 主角立绘
  if(IMG.front.naturalWidth){
    const h=340; const w=h*(IMG.front.naturalWidth/IMG.front.naturalHeight);
    ctx.drawImage(IMG.front, VW/2-w/2, VH/2-h/2+20, w, h);
  }
  // 标题
  ctx.textAlign='center';
  ctx.fillStyle='#d6457c';
  ctx.font='bold 54px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('芋如的冒险', VW/2, 90);
  ctx.fillStyle='#b0416b';
  ctx.font='18px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('第 54 天，我依然像第一天那样，见到你就心跳。', VW/2, 128);
  // 开始按钮
  const bx=VW/2-110, by=VH-150, bw=220, bh=56;
  const gb=ctx.createLinearGradient(bx,0,bx+bw,0);
  gb.addColorStop(0,'#ff7eb3'); gb.addColorStop(1,'#ff5c8a');
  ctx.fillStyle=gb; rr(ctx,bx,by,bw,bh,28); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('开始冒险', VW/2, by+38);
  ctx.fillStyle='#a84b70'; ctx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('← → 移动 · 空格/↑ 跳跃 · M 静音', VW/2, by-18);
  ctx.textAlign='left';
}

/* ---------- 屏幕：过关情话 ---------- */
function drawMessage(){
  ctx.fillStyle='rgba(30,16,40,0.75)'; ctx.fillRect(0,0,VW,VH);
  const cx=VW/2, cy=VH/2;
  ctx.fillStyle='#fff'; rr(ctx,cx-330,cy-130,660,260,24); ctx.fill();
  ctx.fillStyle='#ff6fa5'; ctx.font='bold 22px "PingFang SC","Microsoft YaHei",sans-serif'; ctx.textAlign='center';
  ctx.fillText('第 '+(msgIndex+1)+' 关 通过啦', cx, cy-60);
  ctx.fillStyle='#7a3350'; ctx.font='20px "PingFang SC","Microsoft YaHei",sans-serif';
  const msg = CLEAR_MSGS[msgIndex];
  ctx.fillText(msg, cx, cy+10);
  ctx.fillStyle='#c98aa5'; ctx.font='15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(msgTimer>0.6 ? '（点击任意处继续）' : '', cx, cy+60);
  ctx.textAlign='left';
}

/* ---------- 屏幕：情书结局 ---------- */
function drawFinale(){
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#14122f'); g.addColorStop(1,'#39225f');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  for(let i=0;i<40;i++){
    const x=((i*97+20) % VW); const y=((i*53+10) % VH);
    ctx.fillStyle='rgba(255,255,255,'+(0.4+0.4*Math.sin(performance.now()*0.002+i))+')';
    ctx.beginPath(); ctx.arc(x,y,1+i%3,0,6.283); ctx.fill();
  }
  // 卡片
  ctx.fillStyle='rgba(255,255,255,0.96)'; rr(ctx,120,70,720,400,24); ctx.fill();
  if(IMG.front.naturalWidth){
    const h=180; const w=h*(IMG.front.naturalWidth/IMG.front.naturalHeight);
    ctx.drawImage(IMG.front, 150, VH/2-h/2+20, w, h);
  }
  ctx.textAlign='center';
  ctx.fillStyle='#d6457c'; ctx.font='bold 34px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('致 芋如', VW/2+70, 150);
  ctx.fillStyle='#5a2a42'; ctx.font='17px "PingFang SC","Microsoft YaHei",sans-serif';
  const lines = FINALE; let yy=205;
  for(const ln of lines){ ctx.fillText(ln, VW/2+70, yy); yy+=30; }
  ctx.fillStyle='#c98aa5'; ctx.font='15px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText('（点击任意处 再闯一次）', VW/2+70, VH-120);
  ctx.textAlign='left';
}

/* ---------- 主循环 ---------- */
let last = 0;
function frame(ts){
  const dt = Math.min(0.033, (ts-last)/1000 || 0.016); last=ts;
  update(dt);
  ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE,0,0);
  ctx.clearRect(0,0,VW,VH);
  if(screen==='title'){ drawTitle(); }
  else if(screen==='message'){ drawBackground(); drawPlatforms(); drawHearts(); drawPowerups(); drawEnemies(); drawFlag(); drawPlayer(); drawUI(); drawMessage(); }
  else if(screen==='finale'){ drawFinale(); }
  else {
    drawBackground(); drawPlatforms(); drawHearts(); drawPowerups(); drawEnemies(); drawFlag(); drawPlayer(); drawUI(); drawTouch();
    for(const p of particles){ ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x-camX,p.y,p.s,0,6.283); ctx.fill(); }
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(frame);
}

/* ---------- 交互 ---------- */
function tap(e){
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX-rect.left)/SCALE, y=(e.clientY-rect.top)/SCALE;
  if(screen==='title'){
    if(x>=VW/2-110 && x<=VW/2+110 && y>=VH-150 && y<=VH-94){ tryFullscreen(); sfxStart(); loadLevel(0); }
  } else if(screen==='message'){
    if(msgTimer>0.6){ if(msgIndex+1 < LEVELS.length){ loadLevel(msgIndex+1); } else { screen='finale'; } }
  } else if(screen==='finale'){
    screen='title'; score=0; loveMeter=LOVE_MAX;
  }
}
canvas.addEventListener('mousedown', tap);
canvas.addEventListener('touchstart', e=>{ if(e.touches.length===1){ tap(e.touches[0]); } }, {passive:true});
function toggleMute(){ muted=!muted; }
function tryFullscreen(){
  if(!('ontouchstart' in window)) return;   // 仅手机
  const d = document.documentElement;
  try{ if(d.requestFullscreen){ const p=d.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); } }catch(e){}
  try{ const o = window.screen.orientation; if(o && o.lock){ const r = o.lock('landscape'); if(r && r.catch) r.catch(()=>{}); } }catch(e){}
}

/* ---------- 启动 ---------- */
window.addEventListener('load', ()=>{
  bindTouch('__unused__','left'); // 占位：触屏按钮用 drawTouch 区域手动命中
  requestAnimationFrame(frame);
});
/* 触屏多指控件：方向键和跳跃键可同时按下 */
(function touchControls(){
  const btnOf = new Map();   // touchId -> 'left'|'right'|'jump'
  function region(x,y){
    if(x>=18&&x<=106&&y>=VH-116&&y<=VH-28) return 'left';
    if(x>=120&&x<=208&&y>=VH-116&&y<=VH-28) return 'right';
    if(x>=VW-116&&x<=VW-24&&y>=VH-136&&y<=VH-28) return 'jump';
    return null;
  }
  function sync(){
    let l=false, r=false, j=false;
    for(const b of btnOf.values()){ if(b==='left') l=true; else if(b==='right') r=true; else if(b==='jump') j=true; }
    touchBtn.left=l; touchBtn.right=r; touchBtn.jump=j;
  }
  canvas.addEventListener('touchstart', e=>{
    if(screen!=='play') return;
    const rect = canvas.getBoundingClientRect();
    for(const t of e.changedTouches){
      const x=(t.clientX-rect.left)/SCALE, y=(t.clientY-rect.top)/SCALE;
      const b = region(x,y);
      if(b){ btnOf.set(t.identifier, b); if(b==='jump') input.jumpPressed=true; }
    }
    sync();
  }, {passive:true});
  canvas.addEventListener('touchmove', e=>{
    if(screen!=='play') return;
    const rect = canvas.getBoundingClientRect();
    for(const t of e.changedTouches){
      const x=(t.clientX-rect.left)/SCALE, y=(t.clientY-rect.top)/SCALE;
      const b = region(x,y);
      if(b) btnOf.set(t.identifier, b); else btnOf.delete(t.identifier);
    }
    sync();
  }, {passive:true});
  canvas.addEventListener('touchend', e=>{
    for(const t of e.changedTouches) btnOf.delete(t.identifier);
    sync();
  }, {passive:true});
  canvas.addEventListener('touchcancel', e=>{
    for(const t of e.changedTouches) btnOf.delete(t.identifier);
    sync();
  }, {passive:true});
})();
</script>
